              "borderRadius": {

                      "topbar-height": "64px",
                      "container-padding": "1.5rem",

        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background min-h-screen flex items-center justify-center p-4">
<div class="flex flex-col md:flex-row w-full max-w-4xl bg-surface-container-lowest rounded-lg border border-secondary-fixed overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.04)] min-h-[520px]">
<!-- Left Branding Panel -->
<div class="hidden md:flex w-1/2 bg-inverse-surface relative flex-col justify-center items-center p-10 text-center">
<!-- Background Image with Overlay -->
<div class="absolute inset-0 bg-cover bg-center opacity-30 mix-blend-overlay" data-alt="A striking macro photograph of brilliant-cut diamonds and polished gold facets resting on a dark slate surface. The lighting is sophisticated, employing a high-key spotlight effect that creates sharp, contrasting shadows and highlights the geometric precision of the jewels. The color palette is restricted to deep obsidian blacks, crisp whites, and intense streaks of golden yellow, evoking a highly professional, luxurious, and meticulous inventory management environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDlLE4Zdk75MfvKyaBmWbf60CmIibtNNDaFXw9LkUZtPqEG4IcquTc2BRMso7S-DIxyaB1EIROZ7MkS9kG3w36ar0I0jMMsmEVwJLvJqQXdZ0UL9-j1n0dANdWyd4gPQI-sWxBrEelGEpgTWVavJSz3CJ4B9tFDUVwhjhdgtKJZw2HZh3wRKB8e3iYPx-8VzmXrb4_zBGGmASDPLus_hBgxnI7c2UPNutrPhrz3yurtiWAryxubOm1fNg')">
</div>
<div class="relative z-10 flex flex-col items-center gap-stack-compact">
<div class="w-16 h-16 rounded-full border border-primary-fixed-dim/30 flex items-center justify-center mb-4 bg-inverse-surface">
<span class="material-symbols-outlined text-primary-fixed-dim text-4xl" style="font-variation-settings: 'wght' 300;">diamond</span>
</div>
<h1 class="font-display text-display text-primary-fixed-dim tracking-tight">Annigems</h1>
<p class="font-body-md text-body-md text-surface-variant mt-2 max-w-[200px]">Luxury Inventory Management</p>
</div>
</div>
<!-- Right Login Form Panel -->
<div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center bg-surface-container-lowest">
<div class="mb-8">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-1">Welcome back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please enter your credentials to access the inventory system.</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-stack-dense uppercase" for="email">Email / Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-sm">person</span>
</span>
<input class="w-full h-9 pl-9 pr-3 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface placeholder-tertiary-fixed-dim focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="admin@annigems.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-stack-dense uppercase" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-sm">lock</span>
</span>
<input class="w-full h-9 pl-9 pr-3 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface placeholder-tertiary-fixed-dim focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-4 w-4 rounded-DEFAULT border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full h-9 flex justify-center items-center rounded-lg bg-primary hover:bg-primary-container text-on-primary font-label-caps text-label-caps uppercase transition-colors shadow-sm" type="button">
                        Login
                    </button>
</div>
</form>
</div>
</div>
</body></html>
